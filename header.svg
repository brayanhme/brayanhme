<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Brayan Mancilla — Backend Developer</title>
  <desc id="desc">Professional navy banner for a backend developer focused on APIs, databases, and learning cloud computing with AWS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1221" />
      <stop offset="58%" stop-color="#0C1931" />
      <stop offset="100%" stop-color="#102746" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.31" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#6387BD" fill-opacity="0.20" />
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="23" /></filter>
  </defs>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="22" fill="url(#bg)" stroke="#294265" stroke-opacity="0.95" />
  <rect x="0" y="0" width="1280" height="5" rx="2.5" fill="url(#accent)" />
  <circle cx="1054" cy="175" r="310" fill="url(#glow)" />
  <rect x="826" y="22" width="430" height="315" fill="url(#dots)" opacity="0.75" />
  <path d="M 0 315 C 340 246 564 384 810 315 S 1143 302 1280 320" stroke="#356CA4" stroke-opacity="0.10" stroke-width="2" fill="none" />

