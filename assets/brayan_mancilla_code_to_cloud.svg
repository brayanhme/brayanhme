<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" width="1200" height="262" role="img" aria-labelledby="t d">
<title id="t">From Code to Cloud — Backend development workflow</title>
<desc id="d">Backend request journey through Java and Python, REST APIs, PostgreSQL, Linux Docker and AWS learning. Animated request signals in the connections.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081427"/><stop offset="1" stop-color="#122948"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142c47"/><stop offset="1" stop-color="#0d223a"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#1b82cd" stop-opacity=".2"/><stop offset="1" stop-color="#123052" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#4383b5" opacity=".3"/></pattern>
  <style><![CDATA[
   .dash { animation: flow 2s linear infinite; }
   .on { animation: b 2.4s ease-in-out infinite; }
   .t {font-family:Inter,Arial,sans-serif;}
   @keyframes flow{to{stroke-dashoffset:-80}}
   @keyframes b {0%,100%{opacity:1} 50%{opacity:.3}}
   @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style>
</defs>
<rect width="1200" height="262" fill="url(#bg)" rx="17"/>
<rect x="0" y="0" width="1200" height="262" fill="url(#dots)" rx="17" opacity=".6" />
<ellipse cx="1050" cy="133" rx="360" ry="160" fill="url(#glow)" />
<rect x="0.8" y="0.8" width="1198.4" height="260.4" rx="17" fill="none" stroke="#244865" stroke-width="1.6"/>
<g class="t">
 <text x="38" y="42" font-size="18" font-weight="700" letter-spacing="3" fill="#7ac9f8">FROM CODE TO CLOUD</text>
 <circle cx="994" cy="35" r="5" fill="#5ae1b8" class="on"/><text x="1010" y="41" font-size="13" letter-spacing="1.6" fill="#a0c6d9">LEARNING PATH</text>
 <path d="M36 57 H1164" stroke="#315274" stroke-opacity=".65"/>
 <path d="M242 143 H968" fill="none" stroke="#315e85" stroke-width="3"/>
 <path d="M242 143 H968" fill="none" stroke="#5bcaff" stroke-width="2.3" stroke-dasharray="8 19" stroke-linecap="round" class="dash" opacity=".75"/>
 <g fill="#122a45" stroke="#315978" stroke-width="1.7">
  <rect x="35" y="85" width="210" height="116" rx="14" fill="url(#tile)"/>
  <rect x="265" y="85" width="210" height="116" rx="14" fill="url(#tile)"/>
  <rect x="495" y="85" width="210" height="116" rx="14" fill="url(#tile)"/>
  <rect x="725" y="85" width="210" height="116" rx="14" fill="url(#tile)"/>
  <rect x="955" y="85" width="210" height="116" rx="14" fill="url(#tile)" stroke="#537c8d"/>
 </g>
 <g font-size="13" fill="#729dc0" font-weight="650" letter-spacing="1.3">
  <text x="54" y="109">01 · BUILD</text><text x="284" y="109">02 · SERVE</text><text x="514" y="109">03 · STORE</text><text x="744" y="109">04 · PACKAGE</text><text x="974" y="109" fill="#f0c276">05 · LEARN</text>
 </g>
 <g font-size="22" fill="#e9f5ff" font-weight="700">
  <text x="54" y="145">Java / Python</text><text x="284" y="145">REST APIs</text><text x="514" y="145">PostgreSQL</text><text x="744" y="145">Docker / Linux</text><text x="974" y="145">AWS Cloud</text>
 </g>
 <g font-size="14.5" fill="#9fbddd">
  <text x="54" y="174">Spring · NestJS</text><text x="284" y="174">Auth · Services</text><text x="514" y="174">SQL · Prisma</text><text x="744" y="174">Runtime basics</text><text x="974" y="174">Currently learning</text>
 </g>
 <text x="600" y="237" font-size="14" letter-spacing="2.3" text-anchor="middle" fill="#75a8d4">DESIGN  ·  BUILD  ·  CONNECT  ·  DEPLOY  ·  IMPROVE</text>
</g>
<!-- Connections contain tiny moving signals, visually subordinate to titles. -->
<g fill="#5bdfff">
 <circle r="4"><animateMotion path="M245 143 H265" dur="1.65s" repeatCount="indefinite"/></circle>
 <circle r="4"><animateMotion path="M475 143 H495" dur="1.65s" begin=".36s" repeatCount="indefinite"/></circle>
 <circle r="4"><animateMotion path="M705 143 H725" dur="1.65s" begin=".72s" repeatCount="indefinite"/></circle>
 <circle r="4" fill="#ffc666"><animateMotion path="M935 143 H955" dur="1.65s" begin="1.08s" repeatCount="indefinite"/></circle>
</g>
</svg>